<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado do Pincel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tela-fundo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .restart-btn {
            position: absolute;
            top: 45%;
            right: 7%;
            width: 10%;
            height: 20%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <img src="assets/certificadopincel.png" alt="Certificado Pincel" class="tela-fundo">
    <div class="restart-btn" onclick="location.href='telainicial.html'" title="Jogar de Novo"></div>
</body>

</html>
