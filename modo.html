<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo de Jogo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tela-fundo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .arrow-left {
            position: absolute;
            top: 40%;
            left: 5%;
            width: 10%;
            height: 20%;
            cursor: pointer;
        }

        .mode-btn {
            position: absolute;
            top: 25%;
            left: 30%;
            width: 40%;
            height: 50%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <img src="assets/modo.gif" alt="Modo" class="tela-fundo">
    <div class="arrow-left" onclick="location.href='personagem.html'"></div>
    <div class="mode-btn" onclick="location.href='1desenho.html'"></div>
</body>

</html>
