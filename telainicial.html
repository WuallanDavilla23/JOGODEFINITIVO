<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Inicial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .tela-fundo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }

        .click-area {
            position: absolute;
            top: 15%;
            left: 33%;
            width: 34%;
            height: 75%;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>
    <div class="click-area" onclick="avancar()"></div>
    <img src="assets/telainicial.gif" alt="Tela Inicial" class="tela-fundo">
    <script>
        function avancar() { location.href = 'personagem.html'; }
        window.addEventListener('keydown', () => { avancar(); });
    </script>
</body>

</html>
